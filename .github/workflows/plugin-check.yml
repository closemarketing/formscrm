name: Plugin Check

on:
  push:
    branches:
      - trunk
      - 'release/**'
  pull_request:
    branches:
      - trunk
      - 'feature/**'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create wp-env config
        run: |
          cat > .wp-env.json << 'EOF'
          {
            "phpVersion": "8.2",
            "plugins": [
              ".",
              "https://downloads.wordpress.org/plugin/plugin-check.zip"
            ]
          }
          EOF

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: 'vendor,node_modules,tests'
